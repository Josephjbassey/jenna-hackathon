[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jenna-unified"
version = "0.1.0"
description = "Unified local-first voice AI agent (Jenna + Jenna-AI + Jenna LVA + local_ai_agent). Ollama + Piper + faster-whisper, CPU-optimized for 8 GB."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jabs", email = "jabs@example.com"}]
dependencies = [
    # Audio
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    # Wake Word / ASR
    "onnxruntime>=1.17.0",
    "faster-whisper>=1.0.0",
    # LLM
    "ollama>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    # TTS
    "piper-tts>=1.2.0",
    # Vision (optional)
    "opencv-python-headless>=4.8.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    # Hotkey / desktop
    "pynput>=1.7.6",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    # UI / overlay
    "pywebview>=4.0.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.0",
    # MCP
    "langchain-mcp-adapters>=0.1.0",
    # Config / storage / API
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyYAML>=6.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
kokoro = [
    "kokoro-onnx>=0.3.0",
    "torch>=2.0.0",
]

[project.scripts]
jenna = "main:main"

[tool.setuptools]
packages = ["core", "voice", "skills", "memory", "overlay", "cli", "api"]
include-package-data = true

[tool.ruff]
line-length = 100
target-version = "py311"
