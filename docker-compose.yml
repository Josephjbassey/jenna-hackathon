services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jenna-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONPATH=/app:/app/backend
      - META_MODEL_API_KEY=${META_MODEL_API_KEY:-}
      - META_MODEL_API_BASE=${META_MODEL_API_BASE:-https://api.meta.ai/v1}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - .:/app
    networks:
      - jenna-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jenna-frontend
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jenna-net

networks:
  jenna-net:
    driver: bridge
